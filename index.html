<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lovely Professional University – Digital Lab Booking & Equipment Portal</title>
  
  <!-- LPU Labs Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
/* ==========================================================================
   LOVELY PROFESSIONAL UNIVERSITY (LPU) - DIGITAL LAB EQUIPMENT BOOKING
   Design System, Glassmorphic Theme, Animations & Responsive Layout
   ========================================================================== */

:root {
  /* Brand Colors - Lovely Professional University Palette */
  --lpu-orange: #f26522;
  --lpu-orange-hover: #e05312;
  --lpu-orange-light: #fff7ed;
  --lpu-orange-subtle: rgba(242, 101, 34, 0.12);
  --lpu-orange-glow: rgba(242, 101, 34, 0.35);

  --lpu-navy: #0b1329;
  --lpu-navy-surface: #131c36;
  --lpu-navy-card: rgba(19, 28, 54, 0.78);
  --lpu-blue: #1e40af;
  --lpu-blue-light: #eff6ff;

  /* Neutrals & Surfaces (Light Mode default) */
  --bg-page: #f8fafc;
  --surface: #ffffff;
  --surface-card: rgba(255, 255, 255, 0.88);
  --surface-card-hover: rgba(255, 255, 255, 0.98);
  --surface-secondary: #f1f5f9;
  --surface-elevated: #ffffff;

  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-subtle: #94a3b8;
  --text-inverse: #ffffff;

  --border-light: rgba(226, 232, 240, 0.85);
  --border-card: rgba(226, 232, 240, 0.9);
  --border-focus: #f26522;

  /* Feedback Colors */
  --ok: #10b981;
  --ok-bg: #ecfdf5;
  --ok-border: #a7f3d0;

  --warn: #f59e0b;
  --warn-bg: #fffbeb;
  --warn-border: #fde68a;

  --err: #ef4444;
  --err-bg: #fef2f2;
  --err-border: #fecaca;

  --info: #0284c7;
  --info-bg: #f0f9ff;
  --info-border: #bae6fd;

  /* Typography */
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Radius & Shadows */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 12px 28px -6px rgba(15, 23, 42, 0.12), 0 6px 12px -3px rgba(15, 23, 42, 0.06);
  --shadow-xl: 0 24px 48px -12px rgba(15, 23, 42, 0.18), 0 10px 20px -5px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 24px var(--lpu-orange-glow);

  /* Glass backdrop */
  --backdrop-blur: blur(14px);
}

/* Dark Theme Variables */
[data-theme="dark"] {
  --bg-page: #090d16;
  --surface: #101626;
  --surface-card: rgba(16, 22, 38, 0.78);
  --surface-card-hover: rgba(22, 30, 52, 0.88);
  --surface-secondary: #172033;
  --surface-elevated: #1a233a;

  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  --text-inverse: #090d16;

  --border-light: rgba(255, 255, 255, 0.08);
  --border-card: rgba(255, 255, 255, 0.1);
  --border-focus: #f26522;

  --ok: #34d399;
  --ok-bg: rgba(16, 185, 129, 0.12);
  --ok-border: rgba(16, 185, 129, 0.3);

  --warn: #fbbf24;
  --warn-bg: rgba(245, 158, 11, 0.12);
  --warn-border: rgba(245, 158, 11, 0.3);

  --err: #f87171;
  --err-bg: rgba(239, 68, 68, 0.12);
  --err-border: rgba(239, 68, 68, 0.3);

  --info: #38bdf8;
  --info-bg: rgba(2, 132, 199, 0.12);
  --info-border: rgba(2, 132, 199, 0.3);

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 14px 32px rgba(0, 0, 0, 0.55);
  --shadow-xl: 0 24px 50px rgba(0, 0, 0, 0.7);
}

/* Base Styles */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 15px;
  scroll-behavior: smooth;
  height: 100%;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-page);
  color: var(--text-main);
  line-height: 1.55;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  transition: background-color 0.3s ease, color 0.3s ease;
  -webkit-font-smoothing: antialiased;
}

/* Animated Background Layers */
#bg-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: auto;
  opacity: 0.85;
}

.ambient-container {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}

.ambient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.45;
  mix-blend-mode: normal;
  will-change: transform;
}

.orb-1 {
  top: -10%;
  left: -5%;
  width: 520px;
  height: 520px;
  background: radial-gradient(circle, var(--lpu-orange-glow) 0%, rgba(242, 101, 34, 0) 70%);
  animation: floatOrb 22s ease-in-out infinite alternate;
}

.orb-2 {
  bottom: 5%;
  right: -5%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(30, 64, 175, 0.3) 0%, rgba(30, 64, 175, 0) 70%);
  animation: floatOrb 28s ease-in-out infinite alternate-reverse;
}

.orb-3 {
  top: 40%;
  left: 35%;
  width: 450px;
  height: 450px;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.22) 0%, rgba(139, 92, 246, 0) 70%);
  animation: pulseGlow 18s ease-in-out infinite alternate;
}

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(60px, 40px) scale(1.1); }
  100% { transform: translate(-40px, 70px) scale(0.95); }
}

@keyframes pulseGlow {
  0% { transform: scale(0.9) translate(0, 0); opacity: 0.3; }
  100% { transform: scale(1.2) translate(-30px, 30px); opacity: 0.55; }
}

.ambient-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-size: 40px 40px;
  background-image: 
    linear-gradient(to right, rgba(100, 116, 139, 0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(100, 116, 139, 0.04) 1px, transparent 1px);
}

#app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header & Brand */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface-card);
  backdrop-filter: var(--backdrop-blur);
  -webkit-backdrop-filter: var(--backdrop-blur);
  border-bottom: 1px solid var(--border-card);
  box-shadow: var(--shadow-sm);
  transition: all 0.25s ease;
}

.header-top {
  padding: 10px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  max-width: 1380px;
  margin: 0 auto;
}

.brand-wrapper {
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
}

.brand-emblem {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--lpu-orange) 0%, #c2410c 100%);
  color: #fff;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 12px var(--lpu-orange-glow);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

.brand-titles {
  display: flex;
  flex-direction: column;
}

.brand-univ-title {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-univ-title .tag-lpu {
  background: var(--lpu-orange-subtle);
  color: var(--lpu-orange);
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: var(--radius-full);
  border: 1px solid rgba(242, 101, 34, 0.25);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.brand-portal-sub {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.notification-pill {
  position: relative;
  background: var(--surface-secondary);
  border: 1px solid var(--border-light);
  color: var(--text-main);
  padding: 8px 12px;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  font-weight: 600;
  transition: all 0.2s ease;
}

.notification-pill:hover {
  background: var(--surface-elevated);
  border-color: var(--lpu-orange);
}

.notif-badge {
  background: var(--lpu-orange);
  color: #fff;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
  padding: 1px 7px;
  min-width: 18px;
  text-align: center;
}

.theme-btn {
  background: var(--surface-secondary);
  border: 1px solid var(--border-light);
  color: var(--text-main);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 17px;
  transition: all 0.2s ease;
}

.theme-btn:hover {
  background: var(--surface-elevated);
  border-color: var(--border-focus);
}

.user-badge {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 12px;
  background: var(--surface-secondary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-full);
}

.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--lpu-blue), #4338ca);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.user-meta {
  display: flex;
  flex-direction: column;
}

.user-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.2;
}

.user-role-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--lpu-orange);
  text-transform: capitalize;
}

/* Nav Tabs */
.site-nav {
  background: var(--surface-card);
  border-bottom: 1px solid var(--border-card);
  backdrop-filter: var(--backdrop-blur);
  overflow-x: auto;
  scrollbar-width: none;
}

.site-nav::-webkit-scrollbar {
  display: none;
}

.nav-container {
  max-width: 1380px;
  margin: 0 auto;
  display: flex;
  gap: 4px;
  padding: 6px 24px;
}

.nav-tab {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 10px 16px;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  transition: all 0.2s ease;
}

.nav-tab:hover {
  color: var(--text-main);
  background: var(--surface-secondary);
}

.nav-tab.active {
  color: #fff;
  background: linear-gradient(135deg, var(--lpu-orange) 0%, var(--lpu-orange-hover) 100%);
  box-shadow: 0 4px 12px var(--lpu-orange-glow);
}

.nav-tab .badge {
  background: rgba(255, 255, 255, 0.2);
  color: inherit;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: var(--radius-full);
}

/* Main Container */
.main-wrapper {
  max-width: 1380px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  flex: 1;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 22px;
}

.section-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-subtitle {
  font-size: 13.5px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Cards & Grid */
.card {
  background: var(--surface-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: var(--backdrop-blur);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  position: relative;
}

.card:hover {
  box-shadow: var(--shadow-md);
  border-color: rgba(242, 101, 34, 0.25);
}

.grid-catalog {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 18px;
}

.eq-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
  position: relative;
  overflow: hidden;
}

.eq-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--lpu-orange), var(--lpu-blue));
  opacity: 0;
  transition: opacity 0.2s ease;
}

.eq-card:hover::before {
  opacity: 1;
}

.eq-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}

.eq-icon-badge {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  background: var(--surface-secondary);
  border: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}

.eq-title {
  font-size: 16.5px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.35;
  margin-bottom: 4px;
}

.eq-location {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  color: var(--text-muted);
  font-weight: 500;
}

.eq-specs {
  margin: 12px 0 16px;
  padding: 10px 12px;
  background: var(--surface-secondary);
  border-radius: var(--radius-md);
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.45;
}

.eq-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 14px;
  border-top: 1px solid var(--border-light);
  margin-top: auto;
}

/* Status Badges */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
  text-transform: capitalize;
  letter-spacing: 0.02em;
  line-height: 1;
}

.tag::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.tag.available { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-border); }
.tag.approved { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-border); }
.tag.completed { background: var(--info-bg); color: var(--info); border: 1px solid var(--info-border); }
.tag.pending { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
.tag.rejected, .tag.cancelled, .tag.maint { background: var(--err-bg); color: var(--err); border: 1px solid var(--err-border); }

.category-pill {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 3px 8px;
  background: var(--surface-secondary);
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-light);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 18px;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.2s ease;
  white-space: nowrap;
  text-decoration: none;
}

.btn-primary {
  background: linear-gradient(135deg, var(--lpu-orange) 0%, var(--lpu-orange-hover) 100%);
  color: #fff;
  box-shadow: 0 3px 10px var(--lpu-orange-glow);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px var(--lpu-orange-glow);
}

.btn-secondary {
  background: var(--surface-secondary);
  color: var(--text-main);
  border-color: var(--border-light);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--surface-elevated);
  border-color: var(--border-focus);
}

.btn-danger {
  background: var(--err-bg);
  color: var(--err);
  border-color: var(--err-border);
}

.btn-danger:hover:not(:disabled) {
  background: var(--err);
  color: #fff;
}

.btn-success {
  background: var(--ok-bg);
  color: var(--ok);
  border-color: var(--ok-border);
}

.btn-success:hover:not(:disabled) {
  background: var(--ok);
  color: #fff;
}

.btn-sm {
  padding: 5px 10px;
  font-size: 12.5px;
  border-radius: var(--radius-sm);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none !important;
  transform: none !important;
}

/* Form Inputs */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 10px 14px;
  background: var(--surface-secondary);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-family: inherit;
  font-size: 14px;
  transition: all 0.2s ease;
  outline: none;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  background: var(--surface-elevated);
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--lpu-orange-subtle);
}

.form-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.form-row > * {
  flex: 1;
  min-width: 140px;
}

.filter-bar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 22px;
  background: var(--surface-card);
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-card);
  backdrop-filter: var(--backdrop-blur);
}

.search-box {
  flex: 2;
  min-width: 240px;
  position: relative;
}

.search-box input {
  padding-left: 36px;
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-subtle);
  pointer-events: none;
}

.category-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.cat-pill-btn {
  background: var(--surface-card);
  border: 1px solid var(--border-card);
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.cat-pill-btn:hover {
  background: var(--surface-elevated);
  color: var(--text-main);
  border-color: var(--lpu-orange);
}

.cat-pill-btn.active {
  background: var(--lpu-orange);
  color: #fff;
  border-color: var(--lpu-orange);
  box-shadow: 0 2px 8px var(--lpu-orange-glow);
}

/* Daily Schedule Timeline */
.timeline-bar {
  display: flex;
  height: 28px;
  border-radius: var(--radius-sm);
  background: var(--border-light);
  overflow: hidden;
  margin-bottom: 12px;
  position: relative;
}

.timeline-slot {
  flex: 1;
  height: 100%;
  border-right: 1px solid rgba(255, 255, 255, 0.25);
  transition: opacity 0.2s ease;
}

.timeline-slot.free { background: var(--ok-bg); }
.timeline-slot.booked { background: var(--warn); }

  async function submitBk() {
    const eqId = +$('#be').value;
    const date = $('#bd').value;
    const start = $('#bs').value;
    const end = $('#bf').value;
    const purpose = esc($('#bp').value.trim());

    if (!date || !start || !end) return toast('Please complete all required date & time fields.');
    if (!purpose) return toast('Please provide a brief purpose or experiment description.');

    const b = {
      id: nid(S.bk),
      eq: eqId,
      user: user.name,
      role: user.role,
      dept: user.dept,
      date,
      start,
      end,
      purpose,
      st: user.admin ? 'approved' : 'pending'
    };

    const conflictErr = clash(b);
    if (conflictErr) return toast('⚠️ ' + conflictErr);

    S.bk.push(b);
    note('admin', `New booking request from ${user.name} (${user.dept}) for ${E(b.eq).name} on ${b.date} (${b.start}–${b.end}).`);
    note(user.name, `Your booking request for ${E(b.eq).name} on ${b.date} was submitted and is pending verification.`);

    if (await save()) {
      toast(user.admin ? 'Booking created & auto-approved.' : 'Booking request submitted successfully!');
      tab = 'mine';
      render();
    }
  }

  async function setSt(id, newStatus) {
    const b = S.bk.find((x) => x.id === id);
    if (!b) return;

    if (newStatus === 'approved') {
      const conflictErr = clash(b);
      if (conflictErr) return toast('⚠️ Cannot approve: ' + conflictErr);
    }

    b.st = newStatus;
    note(b.user, `Your booking for ${E(b.eq).name} on ${b.date} (${b.start}–${b.end}) was marked as ${newStatus.toUpperCase()}.`);

    if (user.admin && newStatus === 'cancelled') {
      note('admin', `Booking #${b.id} for ${E(b.eq).name} was cancelled by administrator.`);
    }

    await save();
    toast(`Booking status updated to ${newStatus}.`);
    render();
  }

  async function addMt() {
    const eqId = +$('#me').value;
    const date = $('#md').value;
    const reason = esc($('#mr').value.trim()) || 'Preventive calibration & safety testing';

    if (!date) return toast('Please select a date for maintenance.');

    const m = {
      id: nid(S.mt),
      eq: eqId,
      date,
      reason
    };

    S.mt.push(m);

    const affected = S.bk.filter((b) => b.eq === m.eq && b.date === m.date && ['pending', 'approved'].includes(b.st));
    affected.forEach((b) => {
      b.st = 'cancelled';
      note(b.user, `ALERT: Your booking for ${E(b.eq).name} on ${b.date} was cancelled due to scheduled laboratory maintenance: ${m.reason}.`);
    });

    await save();
    toast(`Equipment marked for maintenance. ${affected.length} conflicting booking(s) automatically cancelled.`);
    render();
  }

  async function removeMt(id) {
    S.mt = S.mt.filter((x) => x.id !== id);
    await save();
    toast('Maintenance block removed.');
    render();
  }

  async function addNewEquipment() {
    const name = esc($('#new-eq-name').value.trim());
    const cat = $('#new-eq-cat').value;
    const lab = esc($('#new-eq-lab').value.trim());
    const model = esc($('#new-eq-model').value.trim()) || 'Standard Model';
    const specs = esc($('#new-eq-specs').value.trim()) || 'Calibrated scientific research instrument';

    if (!name || !lab) return toast('Equipment Name and Lab Location are required.');

    const iconMap = {
      Electronics: '⚡',
      Microscopy: '🔬',
      Computing: '🖥️',
      Fabrication: '🖨️',
      Chemistry: '🧪',
      Biology: '🧬',
      Robotics: '🤖'
    };

    const newEq = {
      id: nid(S.eq),
      name,
      cat,
      lab,
      model,
      specs,
      school: 'School of Advanced Engineering',
      icon: iconMap[cat] || '🔬'
    };

    S.eq.push(newEq);
    note('admin', `New laboratory equipment registered: ${newEq.name} in ${newEq.lab}.`);
    await save();
    toast(`"${newEq.name}" added to catalog.`);
    closeModal();
    render();

  function exportHistoryCSV() {
    const completed = S.bk.filter((b) => user.admin || b.user === user.name);
    if (!completed.length) return toast('No history records to export.');

    let csv = 'BookingID,Equipment,LabLocation,Date,StartTime,EndTime,User,Role,Department,Purpose,Status\n';
    completed.forEach((b) => {
      const eq = E(b.eq);
      csv += `"${b.id}","${eq.name}","${eq.lab}","${b.date}","${b.start}","${b.end}","${b.user}","${b.role || 'student'}","${b.dept || ''}","${(b.purpose || '').replace(/"/g, '""')}","${st(b)}"\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `LPU_Lab_Booking_History_${today()}.csv`;
    link.click();
    toast('Booking ledger exported to CSV.');
  }

  function initAnimatedBackground() {
    const canvas = $('#bg-canvas');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const count = Math.min(75, Math.floor((width * height) / 16000));
    const mouse = { x: -1000, y: -1000, radius: 140 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseout', () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.75,
        vy: (Math.random() - 0.5) * 0.75,
        radius: Math.random() * 2.2 + 1,
        baseColor: Math.random() > 0.4 ? 'rgba(242, 101, 34,' : 'rgba(30, 64, 175,'
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const maxDistance = 125;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        const dxMouse = mouse.x - p.x;
        const dyMouse = mouse.y - p.y;
        const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);

        if (distMouse < mouse.radius) {
          const force = (mouse.radius - distMouse) / mouse.radius;
          p.x -= (dxMouse / distMouse) * force * 1.5;
          p.y -= (dyMouse / distMouse) * force * 1.5;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.baseColor + (isDark ? ' 0.8)' : ' 0.6)');
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p.x - p2.x;
          const dy = p.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < maxDistance) {
            const alpha = (1 - dist / maxDistance) * (isDark ? 0.35 : 0.2);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = isDark ? `rgba(242, 101, 34, ${alpha})` : `rgba(15, 23, 42, ${alpha * 0.75})`;
            ctx.lineWidth = 0.85;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  }
